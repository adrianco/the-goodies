# Oook -- CLI for testing the FunkyGibbon MCP server.
# Workspace member of the root pyproject.toml (ADR-010 section 6).
#
# `[tool.setuptools.packages.find]` is filtered with `include = ["oook*"]`;
# unfiltered discovery here would export `examples` as a top-level
# distribution. The `[build-system]` table forces the PEP 517/660 path so the
# editable install exposes only the `oook` name rather than putting this whole
# directory on sys.path.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oook"
version = "0.3.0"
description = "CLI tool for testing FunkyGibbon MCP server"
readme = "README.md"
# ADR-010 section 6: one requires-python across the workspace, matching the
# deployed interpreter. Was ">=3.9".
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "The Goodies Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.8",
    "httpx>=0.24.0",
    "rich>=15.0.0",
]

[project.scripts]
oook = "oook.cli:cli"

[project.urls]
Homepage = "https://github.com/thegoodies/oook"
Repository = "https://github.com/thegoodies/oook"
Issues = "https://github.com/thegoodies/oook/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["oook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
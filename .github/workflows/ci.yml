name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  ADMIN_PASSWORD_HASH: ""
  JWT_SECRET: "development-secret"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally excluded: SQLite-on-Windows has known file
        # locking / WAL issues that the project does not target (see issue #7,
        # parked). The deployment target is Linux/macOS house servers.
        os: [ubuntu-latest, macos-latest]
        # requires-python is ">=3.11" with no upper bound, so every version
        # from 3.11 up is a supported claim. Test the ends of that range, not
        # just the bottom: the fastapi>=0.133.0 floor exists solely because on
        # 3.14 mcp>=2 requires starlette>=0.48, a constraint that was
        # previously unverified by CI because 3.14 was never in the matrix.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          # setup.py files are retired (ADR-010 section 6); the workspace root
          # pyproject.toml and uv.lock are what the environment now depends on.
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('uv.lock', 'pyproject.toml', '*/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        # ADR-010 section 6: one uv workspace, one install step. `pip install -e .`
        # at the repo root maps all four member source trees into the environment
        # and pulls the full dependency union -- including pytest, pytest-cov,
        # pytest-asyncio and pytest-mock -- replacing the old
        # `cd <component> && pip install -e .` loop that had to be kept in step
        # with funkygibbon/requirements.txt by hand.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        # No `|| true`: this step used to swallow the exit code, so the Test
        # Suite job reported success even when tests failed or failed to
        # collect, and every PR showed green regardless. Failures must fail the
        # job. Integration tests start their own FunkyGibbon server on an
        # ephemeral port (see conftest.py at the repo root), so they run here
        # without any externally provisioned service.
        run: |
          export PYTHONPATH=${{ github.workspace }}:$PYTHONPATH
          export ADMIN_PASSWORD_HASH=""
          export JWT_SECRET="development-secret"
          python -m pytest -v --cov=funkygibbon --cov=blowing-off --cov=inbetweenies --cov=oook --cov-report=xml --cov-report=term-missing

      # ----------------------------------------------------------------------
      # ADR-010 section 3 -- PER-PACKAGE COVERAGE FLOOR GOES HERE.
      #
      # The gate belongs in its own step, not appended to "Run tests" above:
      # `--cov-fail-under` is evaluated against the *combined* coverage of every
      # `--cov` target, so adding `--cov=inbetweenies --cov-fail-under=80` to
      # that command would measure the whole repo against 80, not inbetweenies.
      # A separate run with a single `--cov` target is the only way to make the
      # floor mean what ADR-010 says it means. It also overrides the repo-wide
      # `--cov-fail-under=30` in pytest.ini, which stays as the overall floor.
      #
      # Scoped to the `inbetweenies` test path deliberately: ADR-010 section 3
      # asks that the package be covered by ITS OWN tests, not that it borrow
      # coverage from funkygibbon's integration suite exercising it indirectly.
      # It is also ~30x faster, and avoids the whole-suite shared-state flake.
      # ----------------------------------------------------------------------

      - name: Coverage floor -- inbetweenies (ADR-010 section 3)
        run: |
          export PYTHONPATH=${{ github.workspace }}:$PYTHONPATH
          export ADMIN_PASSWORD_HASH=""
          export JWT_SECRET="development-secret"
          python -m pytest inbetweenies -q --cov=inbetweenies --cov-fail-under=80 \
            --cov-report=term-missing --no-cov-on-fail

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          # One workspace, one install (ADR-010 section 6).
          pip install -e .

      - name: Run Security Checks
        run: |
          # Run safety check (allow to fail)
          safety check || true
          # Run bandit security scan (allow to fail for now)
          bandit -r . -x tests/,test_*.py --severity-level medium --confidence-level medium -f json -o bandit-report.json || true
          # Display results
          if [ -f "bandit-report.json" ]; then
            echo "Bandit security scan results:"
            python -m json.tool bandit-report.json || cat bandit-report.json
          fi

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run linting
        run: |
          # Run flake8 (allow to fail)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
          
          # Check black formatting (don't modify files)
          black --check . --diff || true
          
          # Check import sorting
          isort --check-only --diff . || true

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # One workspace, one install (ADR-010 section 6).
          pip install -e .

      - name: Setup and test components
        run: |
          export PYTHONPATH=${{ github.workspace }}:$PYTHONPATH
          export ADMIN_PASSWORD_HASH=""
          export JWT_SECRET="development-secret"
          
          # Check if database population script exists and run it
          if [ -f "funkygibbon/populate_graph_db.py" ]; then
            cd funkygibbon && python populate_graph_db.py && cd ..
          fi
          
          # Start server in background (if funkygibbon exists)
          if [ -d "funkygibbon" ]; then
            cd funkygibbon
            # Try to start the server
            python -m funkygibbon &
            SERVER_PID=$!
            cd ..
            
            # Wait for server to start
            sleep 10
            
            # Test endpoints
            curl -f http://localhost:8000/health || curl -f http://localhost:8000/ || echo "Server endpoint test completed"
            
            # Kill server
            kill $SERVER_PID || true
          fi
          
          # Test CLI tools if they exist
          which oook && timeout 5 oook --help || echo "oook CLI test completed"
          which inbetweenies && timeout 5 inbetweenies --help || echo "inbetweenies CLI test completed"
          which blowing-off && timeout 5 blowing-off --help || echo "blowing-off CLI test completed"

  validate-dependencies:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    env:
      # MUST override the workflow-level `PYTHONPATH: ${{ github.workspace }}`.
      #
      # That global puts the repo root on sys.path for every Python process in
      # every job, so this job's imports resolved from the CHECKOUT rather than
      # from the install -- making a clean-room check that verified nothing
      # while appearing to pass. It then "found" a leak (`tests` importable)
      # that was the PYTHONPATH, not the packaging.
      #
      # The step already runs from an empty directory to keep cwd off sys.path.
      # That defends against cwd and not against an inherited PYTHONPATH; both
      # are needed for the room to actually be clean.
      PYTHONPATH: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Clean-room install and packaging invariants
        # Proves the documented one-step install (ADR-010 section 6) really does
        # produce a complete environment, and guards the packaging invariants
        # that incident 2a6284f violated. No `|| true` anywhere: these are
        # assertions, and a broken install must fail the job.
        #
        # Every check runs from an empty directory, never the repo root. From
        # the repo root the cwd is on sys.path, so `import funkygibbon` and
        # `import tests` would succeed off the working tree and prove nothing.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          # Fresh venv, then the single documented command.
          python -m venv test_env
          VENV_PY="$GITHUB_WORKSPACE/test_env/bin/python"
          "$VENV_PY" -m pip install --upgrade pip setuptools wheel
          "$VENV_PY" -m pip install -e .

          mkdir -p "$RUNNER_TEMP/importcheck"
          cd "$RUNNER_TEMP/importcheck"

          # 1. One install, all four members importable.
          "$VENV_PY" -c "import funkygibbon, inbetweenies, blowingoff, oook"
          "$VENV_PY" -c "import inbetweenies.models, inbetweenies.mcp, inbetweenies.sync, inbetweenies.graph"

          # 2. `import mcp` must resolve to the real MCP SDK. inbetweenies/ and
          #    funkygibbon/ ARE their own package roots, so package discovery
          #    inside them registers `mcp`, `models`, `sync` and `graph` as
          #    top-level distributions and shadows the SDK for the entire
          #    environment -- which is what broke test collection repo-wide.
          "$VENV_PY" - <<'PY'
          import mcp, pathlib
          resolved = pathlib.Path(mcp.__file__).resolve()
          assert "site-packages" in resolved.parts, (
              f"import mcp resolved to {resolved}, not the MCP SDK -- "
              "package discovery has leaked a member subpackage as a top-level distribution"
          )
          print("mcp ->", resolved)
          PY

          # 3. No member subpackage or test tree installed as a top-level name.
          # Report WHERE a leaked name resolves from, not just that it does.
          # A bare pass/fail cannot distinguish "our package discovery leaked a
          # subpackage" from "some third-party wheel ships a top-level tests/"
          # -- and those need opposite fixes. This check failed in CI while
          # being unreproducible on macOS across 3.11 and 3.14, which is exactly
          # the case where the origin path is the whole diagnosis.
          leaked=0
          for mod in mcp.tools models sync graph repositories utils auth search api tests; do
            # MUST report namespace packages too. A directory without
            # __init__.py (repo-root tests/ is one) yields a spec whose .origin
            # is None while `import` still succeeds -- so checking .origin alone
            # silently passes the exact leak this gate exists to catch.
            origin=$("$VENV_PY" -c "
          import importlib.util as u
          try:
              s = u.find_spec('$mod')
          except Exception:
              s = None
          if s is None:
              print('')
          elif s.origin:
              print(s.origin)
          else:
              locs = list(s.submodule_search_locations or [])
              print('namespace package: ' + ', '.join(locs) if locs else 'namespace package')
          " 2>/dev/null || true)
            if [ -n "$origin" ]; then
              echo "FAIL: top-level '$mod' is importable -- resolves to: $origin"
              leaked=1
            fi
          done
          if [ "$leaked" = "1" ]; then
            echo "--- installed distributions owning a top-level 'tests' ---"
            "$VENV_PY" - <<'PY'
          import importlib.metadata as md
          for dist in md.distributions():
              tops = (dist.read_text("top_level.txt") or "").split()
              if "tests" in tops:
                  print(f"  {dist.metadata['Name']} {dist.version} declares top-level 'tests'")
          PY
            exit 1
          fi
          echo "No top-level leakage."

          # 4. Dependency set is internally consistent.
          "$VENV_PY" -m pip check

  knowledge-graph:
    name: Knowledge Graph
    # ADR-010 section 5: keep the graph, and its dead-code signal, fresh.
    #
    # main only. On a PR the graph would describe a branch nobody has merged,
    # and the dead-code signal is only meaningful against the trunk.
    #
    # This job is allowed to FAIL the build, deliberately. graphify extracts via
    # tree-sitter, so a failed rebuild means the repo stopped parsing -- a real
    # signal, not tooling noise. No `|| true`: this repo has been bitten four
    # times by CI steps that reported success without checking anything --
    # `pytest || true`, validate-dependencies' `|| echo` no-ops, that same job
    # silently importing from the checkout because it inherited the
    # workflow-level PYTHONPATH, and graphify's own post-commit hook, which
    # backgrounds its rebuild so a failure never reaches git. The graph is not
    # committed -- graphify-out/ is gitignored -- so the artifact upload is
    # what makes this job's output reachable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install graphify
        # Pinned below 1.0: pre-1.0 minors are not guaranteed compatible, and a
        # silent bump would change the graph under us without a code change.
        run: pip install "graphifyy<1.0"

      - name: Rebuild the knowledge graph
        run: graphify update .

      - name: Report graph size
        run: |
          python - <<'PY'
          import json, pathlib
          graph = json.loads(pathlib.Path("graphify-out/graph.json").read_text())
          # NetworkX node-link format: edges live under "links", not "edges".
          nodes, links = graph.get("nodes", []), graph.get("links", [])
          print(f"nodes={len(nodes)} edges={len(links)}")
          if not nodes:
              raise SystemExit("graph is empty -- extraction produced nothing")
          PY

      - name: Upload graph and report
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-graph
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          retention-days: 30
          if-no-files-found: error
